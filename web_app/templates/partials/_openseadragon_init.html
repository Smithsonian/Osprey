{% if zoom_exists == 1 %}
    <script src="{{ url_for('static', filename='js/openseadragon.min.js') }}"></script>
    <script type="text/javascript">
        var viewer = OpenSeadragon({
            id: "openseadragon",
            prefixUrl: "{{ prefix_url | default('../../static/images/') }}",
            tileSources: "{{ zoom_filename }}",
            timeout: 60000,
            tileRetryMax: 2,
            preload: true,
            constrainDuringPan: true,
            showRotationControl: true,
            showNavigator: true,
            maxZoomPixelRatio: 1
        });
    </script>
{% elif zoom_exists == 2 %}
    <script src="{{ url_for('static', filename='js/openseadragon.min.js') }}"></script>
    <script type="text/javascript">
        var viewer = OpenSeadragon({
            element: document.getElementById('openseadragon'),
            tileSources: "{{ iiif_image }}",
            prefixUrl: "{{ prefix_url | default('../../static/images/') }}",
            preload: true,
            constrainDuringPan: true,
            showRotationControl: true,
            showNavigator: true,
            maxZoomPixelRatio: 1
        });
    </script>
{% endif %}
